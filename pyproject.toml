[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl"
version = "0.1.0"
description = "AutoML pipeline for Machine Learning Challenge (M1 IA Le Mans Université)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Lionel Sachat NKEOUA MBEMBA" },
    { name = "Amine MOULAI" },
    { name = "Zakaria FARACH" }
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "optuna",
    "joblib",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["automl*"]
